<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BedMatrix - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 12h-4l-3 9L9 3l-3 9H2'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.default.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
            
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;

            /* Flexbox for centering login card */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* Blur Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(10px);
            z-index: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: max-width 0.4s ease; /* Smooth transition for resizing */
            animation: slideInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            position: relative;
            z-index: 10;
        }

        .login-card.register-mode {
            max-width: 600px; /* Wider card for horizontal form */
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-logo {

            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(45deg, #38bdf8, #818cf8, #c084fc);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: logoShimmer 3s ease infinite;
        }

        @keyframes logoShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-header p {
            margin: 10px 0 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Floating Labels */
        .floating-group {
            position: relative;
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            padding: 16px 12px 8px 12px; /* More top padding for label space */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: rgba(0, 0, 0, 0.2);
            color: white;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .floating-label {
            position: absolute;
            top: 14px;
            left: 12px;
            color: #b7b7b7;
            font-size: 15px;
            pointer-events: none;
            transition: all 0.2s ease;
            background-color: transparent;
        }

        /* Move label up when focused or has content (using placeholder-shown trick) */
        .form-control:focus ~ .floating-label,
        .form-control:not(:placeholder-shown) ~ .floating-label {
            top: 2px;
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
            background-color: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 40px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            user-select: none;
            transition: color 0.2s, transform 0.3s;
        }

        .password-toggle:hover {
            color: #38bdf8;
        }

        /* Tooltip Styles */
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper .form-control {
            padding-right: 40px;
        }

        .info-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: help;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .info-icon:hover {
            color: #38bdf8;
        }

        .tooltip-text {
            visibility: hidden;
            width: 220px;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px 12px;
            position: absolute;
            z-index: 10;
            bottom: 140%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            line-height: 1.4;
        }

        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }

        .info-icon:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-me {
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .forgot-password {
            color: #38bdf8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #2563eb, #0ea5e9);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            z-index: 10;
        }

        /* Custom Notification Styles */
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            background: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3b82f6; /* Default blue */
            transform: translateX(120%); /* Start off-screen */
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 300px;
            font-size: 14px;
            color: #334155;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            border-left-color: #ef4444; /* Red */
        }

        .notification.success {
            border-left-color: #22c55e; /* Green */
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
        }

        .toggle-text a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        /* Horizontal Register Form Styles */
        #registerForm {
            /* Grid layout applied via JS when visible */
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        #registerForm .btn-login {
            grid-column: span 2; /* Button spans full width */
        }

        #registerForm .form-group {
            margin-bottom: 0; /* Let grid gap handle spacing */
        }

        .full-width {
            grid-column: span 2;
        }

        /* Error Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
            border-color: #ef4444 !important;
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-loading .spinner {
            display: block;
        }

        /* Success Fade Out */
        .fade-out-up {
            animation: fadeOutUp 0.5s forwards;
        }

        @keyframes fadeOutUp {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        /* Global Polish */
        ::selection { background: #38bdf8; color: white; }

        /* Tom Select Customization */
        .ts-wrapper.country-select { width: 110px; flex-shrink: 0; }
        .ts-wrapper.nationality-select { width: 100%; margin-bottom: 20px; }
        .ts-control {
            padding: 12px 8px !important;
            min-height: unset !important;
            height: 48px; /* Match form-control height on login page */
            border-radius: 6px !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            background-color: rgba(0, 0, 0, 0.2) !important;
            color: white !important;
        }
        .ts-control input { color: white !important; }
        .ts-dropdown { background-color: #1e293b; border-color: rgba(255,255,255,0.1); color: white; }
        .ts-dropdown .option:hover, .ts-dropdown .active { background-color: #334155; color: white; }
    </style>
</head>
<body>
    <div id="notification-container" class="notification-container"></div>

    <div class="login-card">
        <div class="login-header">
            <h2 class="brand-logo">BedMatrix</h2>
            <p>Advanced Bed Management System</p>
        </div>
        <form id="loginForm">
            <div class="form-group floating-group">
                <div class="input-wrapper">
                    <input type="text" id="staffId" class="form-control" placeholder=" " required>
                    <label for="staffId" class="floating-label">Staff ID</label>
                    <div class="info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        <span class="tooltip-text">Format: HOSP/ROLE/YYYY/NNNN<br>e.g. HOSP/DOC/2024/0042</span>
                    </div>
                </div>
            </div>

            <div class="form-group floating-group">
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-control" placeholder=" " required>
                    <label for="password" class="floating-label">Password</label>
                    <span class="password-toggle" onclick="togglePassword('password', this)"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span class="spinner"></span>
                <span class="btn-text">Login</span>
            </button>
        </form>

        <form id="registerForm" style="display: none;">
            <div class="form-group floating-group">
                <input type="text" id="regFullName" class="form-control" placeholder=" " required>
                <label for="regFullName" class="floating-label">Full Name</label>
            </div>

            <div class="form-group floating-group">
                <div class="input-wrapper">
                    <input type="text" id="regStaffId" class="form-control" placeholder=" " required>
                    <label for="regStaffId" class="floating-label">Staff ID</label>
                    <div class="info-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        <span class="tooltip-text">Format: HOSP/ROLE/YYYY/NNNN<br>Roles: DOC, ADM, NUR, WMG, REC</span>
                    </div>
                </div>
            </div>

            <div class="form-group floating-group">
                <input type="email" id="regEmail" class="form-control" placeholder=" " required>
                <label for="regEmail" class="floating-label">Email Address</label>
            </div>

            <!-- Nationality Select -->
            <select id="regNationality" class="nationality-select" placeholder="Select Nationality..." required></select>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <select id="regCountryCode" class="country-select"></select>
                <div class="floating-group" style="flex-grow: 1; margin-bottom: 0;">
                    <input type="tel" id="regContact" class="form-control" placeholder=" " required>
                    <label for="regContact" class="floating-label">Contact (9 digits)</label>
                </div>
            </div>

            <div class="form-group floating-group">
                <div class="password-wrapper">
                    <input type="password" id="regPassword" class="form-control" placeholder=" " required>
                    <label for="regPassword" class="floating-label">Password</label>
                    <span class="password-toggle" onclick="togglePassword('regPassword', this)"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
                </div>
            </div>

            <div class="form-group floating-group">
                <div class="password-wrapper">
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder=" " required>
                    <label for="regConfirmPassword" class="floating-label">Confirm Password</label>
                    <span class="password-toggle" onclick="togglePassword('regConfirmPassword', this)"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnRegister">
                <span class="spinner"></span>
                <span class="btn-text">Register</span>
            </button>
        </form>

        <div id="toggleTextLogin" class="toggle-text">
            Don't have an account? <a href="#" id="showRegister">Register</a>
        </div>
        <div id="toggleTextRegister" class="toggle-text" style="display: none;">
            Already have an account? <a href="#" id="showLogin">Login</a>
        </div>
    </div>
    <div class="footer-text">© 2024 BedMatrix System</div>

    <script>
        // Client-side session check
        if (localStorage.getItem('nbs_current_user')) {
            window.location.href = 'dashboard.html';
        }

        function showNotification(message, type) {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            container.appendChild(notification);

            // Save to LocalStorage for Notifications Tab
            const notifData = {
                message: message,
                type: type,
                timestamp: new Date().toLocaleString()
            };
            const storedNotifs = JSON.parse(localStorage.getItem('nbs_notifications') || '[]');
            storedNotifs.unshift(notifData); // Add to top
            localStorage.setItem('nbs_notifications', JSON.stringify(storedNotifs));

            // Small delay to allow DOM render before adding class for transition
            setTimeout(() => notification.classList.add('show'), 10);

            // Remove after 3 seconds
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300); // Wait for transition
            }, 3000);
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                input.type = "password";
                icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }

        function shakeInputs(formId) {
            const inputs = document.querySelectorAll(`#${formId} .form-control`);
            inputs.forEach(input => {
                input.classList.add('shake');
                setTimeout(() => input.classList.remove('shake'), 400);
            });
        }

        // Toggle Forms Logic
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const headerTitle = document.querySelector('.login-header h2');
        const headerDesc = document.querySelector('.login-header p');
        const toggleLogin = document.getElementById('toggleTextLogin');
        const toggleRegister = document.getElementById('toggleTextRegister');
        const loginCard = document.querySelector('.login-card');

        document.getElementById('showRegister').addEventListener('click', (e) => {
            e.preventDefault();
            loginCard.classList.add('register-mode'); // Make card wider
            loginForm.style.display = 'none';
            registerForm.style.display = 'grid'; // Use grid for horizontal layout
            toggleLogin.style.display = 'none';
            toggleRegister.style.display = 'block';
            headerTitle.textContent = 'Register';
            headerDesc.textContent = 'Create your BedMatrix account';
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            loginCard.classList.remove('register-mode'); // Revert width
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            toggleLogin.style.display = 'block';
            toggleRegister.style.display = 'none';
            headerTitle.textContent = 'BedMatrix';
            headerDesc.textContent = 'Advanced Bed Management System';
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const staffId = document.getElementById('staffId').value;
            const password = document.getElementById('password').value;

            const btn = document.getElementById('btnLogin');
            const btnText = btn.querySelector('.btn-text');

            // Loading State
            btn.classList.add('btn-loading');
            btn.disabled = true;
            btnText.textContent = 'Authenticating...';

            const formData = new FormData();
            formData.append('action', 'login');
            formData.append('staffId', staffId);
            formData.append('password', password);

            fetch('api.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                setTimeout(() => { // Simulate network delay
                    if (data.success) {
                        // On success, save user data to localStorage for other pages to access
                        localStorage.setItem('nbs_current_user', JSON.stringify(data.user));
                        showNotification(`Welcome back, ${data.user.fullName}!`, 'success');
                        loginCard.classList.add('fade-out-up');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 600);
                    } else {
                        showNotification(data.message || 'Invalid Staff ID or Password.', 'error');
                        shakeInputs('loginForm');
                        btn.classList.remove('btn-loading');
                        btn.disabled = false;
                        btnText.textContent = 'Login';
                    }
                }, 1000);
            })
            .catch(() => {
                showNotification('An error occurred. Please try again.', 'error');
                btn.classList.remove('btn-loading');
                btn.disabled = false;
                btnText.textContent = 'Login';
            });
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const pass = document.getElementById('regPassword').value;
            const confirmPass = document.getElementById('regConfirmPassword').value;
            const staffId = document.getElementById('regStaffId').value;
            const fullName = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const nationality = document.getElementById('regNationality').value;
            const countryCode = document.getElementById('regCountryCode').value;
            const contactNum = document.getElementById('regContact').value;

            // Validate Staff ID Format: HOSP/ROLE/YYYY/NNNN
            const staffIdPattern = /^[A-Z0-9]+\/(DOC|ADM|NUR|WMG|REC)\/\d{4}\/\d{4}$/;
            if (!staffIdPattern.test(staffId)) {
                showNotification('Invalid Staff ID. Format: HOSP/ROLE/YYYY/NNNN', 'error');
                shakeInputs('registerForm');
                return;
            }

            const reqLen = getRequiredLength(countryCode);
            if ((reqLen > 0 && contactNum.length !== reqLen) || (reqLen === 0 && (contactNum.length < 7 || contactNum.length > 15))) {

                return;
            }

                showNotification('Passwords do not match.', 'error');
                shakeInputs('registerForm');
                return;
            }

            const extractedRole = staffId.split('/')[1] || 'STAFF';

            // Save to "Database"
            const newUser = {
                fullName: fullName,
                staffId: staffId,
                email: email,
                nationality: nationality,
                contact: `${countryCode} ${contactNum}`,
                password: pass,
                role: extractedRole
            };

            btnText.textContent = 'Creating Account...';

            fetch('api.php', {
                method: 'POST',

                body: JSON.stringify({ action: 'register', ...newUser })
            })
